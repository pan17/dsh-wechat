name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # GitHub Release first: the changelog query validates the release notes
  # (fail fast if the version section is missing) and the Release is created
  # BEFORE anything is published to npm — if this job fails, publish-npm
  # never runs, so npm and GitHub can never drift apart.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from CHANGELOG.md
        id: changelog
        uses: release-flow/keep-a-changelog-action@v3
        with:
          command: query
          version: ${{ github.ref_name }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.release-notes }}
          draft: false

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # CI quality gate: when the tag push and the main push happen in the
      # same `git push origin main --tags`, CI on the main commit and
      # Release on the tag fire in parallel. Block here until CI settles on
      # a green conclusion before any artifact goes to npm — a red CI must
      # never silently ship. Polls up to ~5 minutes (CI itself runs ~15s,
      # the slack is for queue + the parallel-release runner).
      - name: Wait for CI on this commit to be green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="$GITHUB_SHA"
          echo "Checking CI conclusion for $SHA..."
          for i in $(seq 1 60); do
            CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$SHA" \
              --jq '.workflow_runs[] | select(.name=="CI") | "\(.conclusion)\t\(.status)"' | head -1)
            case "$CONCLUSION" in
              "success	completed")
                echo "CI is green ✓"; exit 0 ;;
              "failure	completed"|"cancelled	completed"|"timed_out	completed")
                echo "::error::CI conclusion '$CONCLUSION' — blocking npm publish"
                exit 1 ;;
              *)
                echo "Attempt $i/60 — CI status: '${CONCLUSION:-pending}' (sleeping 5s)"
                sleep 5 ;;
            esac
          done
          echo "::error::Timed out waiting for CI to settle on $SHA"
          exit 1
      - uses: actions/setup-node@v4
        with:
          # Pin Node 22 to match the helper module's zstd API surface;
          # see .github/workflows/ci.yml for the rationale.
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DSH_WECHAT }}
