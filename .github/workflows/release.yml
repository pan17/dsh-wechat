name: Release

# A tag is the ONLY trigger. Everything the release needs is verified here,
# on the tagged commit itself — the workflow does not poll `ci.yml` and does
# not depend on CI having run on `main` first.
#
# History: this used to be a `ci-green` job that polled the CI run for the
# same SHA for 5 minutes. That failed twice over — `ci.yml` only triggers on
# `push: branches: [main]`, so a tag pushed on its own had NO CI run to wait
# for (guaranteed timeout), and when `main` and the tag were pushed together
# the CI run and the poll started simultaneously, so a slow runner queue
# (one run took 7m35s) blew the 5-minute budget and blocked the whole
# release. Re-running the workflow by hand was the only way out. Verifying
# in place removes both failure modes: there is nothing to wait for.
on:
  push:
    tags:
      - 'v*'

# Two tags pushed in quick succession must not publish concurrently. The
# group is per-tag, and an in-flight release is never cancelled midway — a
# half-published release is worse than a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Build + test on the tagged commit, and refuse a tag that disagrees with
  # package.json. This runs BEFORE anything is created, so a mismatch costs
  # nothing to undo: no GitHub Release, no npm version, no tag surgery.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pin Node 22 to match the helper module's zstd API surface; see
          # .github/workflows/ci.yml for the rationale.
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # An explicit cache with `restore-keys` rather than setup-node's
      # `cache: npm`. That option keys strictly on `hashFiles(lockfile)`,
      # and `npm version` rewrites package-lock.json on every release — so
      # the release commit ALWAYS missed and cold-installed (7m01s once).
      # The prefix fallback turns a key change into a partial hit instead.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Tag must match package.json version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "v$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches package.json ✓"

  # GitHub Release notes come from CHANGELOG.md. `query` fails the job when
  # the version section is missing, which is the intended outcome: a release
  # with empty notes is worse than no release.
  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from CHANGELOG.md
        id: changelog
        uses: release-flow/keep-a-changelog-action@v3
        with:
          command: query
          version: ${{ github.ref_name }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.release-notes }}
          draft: false

  # `needs: release` — not `verify`. The previous comment claimed npm waited
  # on the Release while the code only waited on the CI gate, so a Release
  # that failed (missing CHANGELOG section, API hiccup) still let npm publish
  # and the two artefacts could drift apart. The comment is now the contract.
  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - run: npm ci
      # No separate `npm run build`: `prepublishOnly` already runs
      # `npm run build && npm test`, so building here duplicated it and
      # tested the pre-hook output rather than the shipped one.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DSH_WECHAT }}
